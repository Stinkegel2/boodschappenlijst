<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Boodschappenlijst</title>
        <body>
            <table>
                <tr>
                    <th>Product</th>
                    <th>Prijs</th>
                    <th>Hoeveelheid</th>
                    <th>Subtotaal</th>
                </tr>
                <tr>
                    <td>Rijst</td>
                    <td class="productPrice">1.00</td>
                    <td class="productQuantity"><input type="number"></td>
                    <td class="productTotalCost"></td>
                </tr>
                <tr>
                    <td>Broccoli</td>
                    <td class="productPrice">0.99</td>
                    <td class="productQuantity"><input type="number"></td>
                    <td class="productTotalCost"></td>
                </tr>
                <tr>
                    <td>Koekjes</td>
                    <td class="productPrice">1.20</td>
                    <td class="productQuantity"><input type="number"></td>
                    <td class="productTotalCost"></td>
                </tr>
                <tr>
                    <td>Noten</td>
                    <td class="productPrice">2.99</td>
                    <td class="productQuantity"><input type="number"></td>
                    <td class="productTotalCost"></td>
                </tr>
                <tr>
                    <td class="price" colspan="3">Totaal</td>
                    <td class="price" id="totalCost">0.00</td>
                </tr>
            </table>
            <script>
                const table = document.querySelector("table");

table.addEventListener("input", function () {
    const prices = document.getElementsByClassName("productPrice");
    const quantities = document.getElementsByClassName("productQuantity");
    const subtotals = document.getElementsByClassName("productTotalCost");

    let totalCost = 0;

    for (let i = 0; i < prices.length; i++) {
        
        let price = parseFloat(prices[i].textContent);

      
        let quantity = parseInt(
            quantities[i].querySelector("input").value
        ) || 0;

     
        let subtotal = price * quantity;

       
        subtotals[i].textContent = subtotal.toFixed(2);

      
        totalCost += subtotal;
    }

    
    document.getElementById("totalCost").textContent =
        totalCost.toFixed(2);
});
    </script>
        </body>
    </head>
</html>
